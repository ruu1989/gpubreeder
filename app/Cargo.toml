[package]
name = "gpubreeder-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Desktop app for GPUBreeder: scan clones, find plans, and follow a timed planting guide."
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
gpubreeder = { path = ".." }
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
